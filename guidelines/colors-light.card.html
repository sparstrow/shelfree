<!-- @dsCard group="Colors" viewport="700x130" subtitle="Light surface hierarchy — background → panel → muted" name="Surface – Light" -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Geist',ui-sans-serif,sans-serif;background:#f0f0f0;color:#18181b;padding:20px 24px;-webkit-font-smoothing:antialiased}
</style>
</head>
<body>
<div style="display:flex;gap:12px;align-items:stretch">
  <div style="flex:1;border-radius:8px;overflow:hidden;border:1px solid #e4e4e7">
    <div style="height:56px;background:#ffffff"></div>
    <div style="padding:10px 12px;background:#fff">
      <div style="font-size:11px;font-weight:600;color:#71717a;letter-spacing:0.06em">BACKGROUND</div>
      <div style="font-size:12px;color:#18181b;margin-top:2px;font-weight:500">#ffffff</div>
      <div style="font-size:11px;color:#a1a1aa;margin-top:1px">--background</div>
    </div>
  </div>
  <div style="flex:1;border-radius:8px;overflow:hidden;border:1px solid #e4e4e7">
    <div style="height:56px;background:#fafafa"></div>
    <div style="padding:10px 12px;background:#fff">
      <div style="font-size:11px;font-weight:600;color:#71717a;letter-spacing:0.06em">PANEL / SIDEBAR</div>
      <div style="font-size:12px;color:#18181b;margin-top:2px;font-weight:500">#fafafa</div>
      <div style="font-size:11px;color:#a1a1aa;margin-top:1px">--panel / --sidebar</div>
    </div>
  </div>
  <div style="flex:1;border-radius:8px;overflow:hidden;border:1px solid #e4e4e7">
    <div style="height:56px;background:#f4f4f5"></div>
    <div style="padding:10px 12px;background:#fff">
      <div style="font-size:11px;font-weight:600;color:#71717a;letter-spacing:0.06em">MUTED</div>
      <div style="font-size:12px;color:#18181b;margin-top:2px;font-weight:500">#f4f4f5</div>
      <div style="font-size:11px;color:#a1a1aa;margin-top:1px">--muted</div>
    </div>
  </div>
  <div style="flex:1;border-radius:8px;overflow:hidden;border:1px solid #e4e4e7">
    <div style="height:56px;background:#e4e4e7"></div>
    <div style="padding:10px 12px;background:#fff">
      <div style="font-size:11px;font-weight:600;color:#71717a;letter-spacing:0.06em">BORDER</div>
      <div style="font-size:12px;color:#18181b;margin-top:2px;font-weight:500">#e4e4e7</div>
      <div style="font-size:11px;color:#a1a1aa;margin-top:1px">--border</div>
    </div>
  </div>
  <div style="flex:1;border-radius:8px;overflow:hidden;border:1px solid #e4e4e7">
    <div style="height:56px;background:#d9d9de"></div>
    <div style="padding:10px 12px;background:#fff">
      <div style="font-size:11px;font-weight:600;color:#71717a;letter-spacing:0.06em">INPUT</div>
      <div style="font-size:12px;color:#18181b;margin-top:2px;font-weight:500">#d9d9de</div>
      <div style="font-size:11px;color:#a1a1aa;margin-top:1px">--input</div>
    </div>
  </div>
</div>
</body>
</html>
