<!-- @dsCard group="Spacing" viewport="700x110" subtitle="Border weights, dividers, focus ring, input state" name="Borders & Dividers" -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Geist',ui-sans-serif,sans-serif;background:#0c0c0e;color:#f4f4f5;padding:20px 24px;-webkit-font-smoothing:antialiased}
</style>
</head>
<body>
<div style="display:flex;gap:12px;align-items:stretch">
  <div style="flex:1;background:#161618;border-radius:8px;border:1px solid #26262b;padding:14px">
    <div style="font-size:10.5px;font-weight:600;color:#8a8a93;letter-spacing:0.06em;margin-bottom:10px">CARD / PANEL</div>
    <div style="border:1px solid #26262b;border-radius:8px;height:36px;display:flex;align-items:center;padding:0 10px;font-size:12px;color:#8a8a93">1px solid --border</div>
  </div>
  <div style="flex:1;background:#161618;border-radius:8px;border:1px solid #26262b;padding:14px">
    <div style="font-size:10.5px;font-weight:600;color:#8a8a93;letter-spacing:0.06em;margin-bottom:10px">INPUT DEFAULT</div>
    <div style="border:1px solid #34343b;border-radius:8px;height:36px;display:flex;align-items:center;padding:0 10px;font-size:12px;color:#8a8a93">1px solid --input</div>
  </div>
  <div style="flex:1;background:#161618;border-radius:8px;border:1px solid #26262b;padding:14px">
    <div style="font-size:10.5px;font-weight:600;color:#8a8a93;letter-spacing:0.06em;margin-bottom:10px">INPUT FOCUS</div>
    <div style="border:1px solid oklch(0.72 0.13 58);border-radius:8px;height:36px;display:flex;align-items:center;padding:0 10px;font-size:12px;color:#f4f4f5;box-shadow:0 0 0 3px color-mix(in oklab,oklch(0.72 0.13 58) 20%,transparent)">Focused input</div>
  </div>
  <div style="flex:1;background:#161618;border-radius:8px;border:1px solid #26262b;padding:14px">
    <div style="font-size:10.5px;font-weight:600;color:#8a8a93;letter-spacing:0.06em;margin-bottom:8px">DIVIDER</div>
    <div style="height:18px;display:flex;flex-direction:column;justify-content:center"><div style="height:1px;background:#26262b"></div></div>
    <div style="font-size:10.5px;color:#8a8a93;margin-top:6px">1px solid --border</div>
  </div>
</div>
</body>
</html>
