<!-- @dsCard group="Spacing" viewport="700x110" subtitle="Border radius tokens — xs 6px through full 999px" name="Border Radius" -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Geist',ui-sans-serif,sans-serif;background:#0c0c0e;color:#f4f4f5;padding:20px 24px;-webkit-font-smoothing:antialiased}
.item{display:flex;flex-direction:column;align-items:center;gap:10px}
.box{width:48px;height:48px;background:#26262b;border:1.5px solid #34343b}
.tok{font-size:10.5px;color:#8a8a93;text-align:center}
.val{font-size:11px;color:#f4f4f5;font-weight:500;text-align:center}
</style>
</head>
<body>
<div style="display:flex;gap:24px;align-items:center">
  <div class="item"><div class="box" style="border-radius:0"></div><div class="val">0</div><div class="tok">none</div></div>
  <div class="item"><div class="box" style="border-radius:6px"></div><div class="val">6px</div><div class="tok">--radius-xs</div></div>
  <div class="item"><div class="box" style="border-radius:8px"></div><div class="val">8px</div><div class="tok">--radius-sm</div></div>
  <div class="item"><div class="box" style="border-radius:10px"></div><div class="val">10px</div><div class="tok">--radius-md</div></div>
  <div class="item"><div class="box" style="border-radius:16px"></div><div class="val">16px</div><div class="tok">--radius-lg</div></div>
  <div class="item"><div class="box" style="border-radius:999px"></div><div class="val">999px</div><div class="tok">--radius-full</div></div>
  <div style="flex:1;border-left:1px solid #26262b;padding-left:20px">
    <div style="font-size:11.5px;color:#8a8a93;line-height:1.8">
      <div><strong style="color:#f4f4f5">xs 6px</strong> — small badges, chips</div>
      <div><strong style="color:#f4f4f5">sm 8px</strong> — inputs, buttons, toolbar</div>
      <div><strong style="color:#f4f4f5">md 10px</strong> — cards, panels, tables</div>
      <div><strong style="color:#f4f4f5">lg 16px</strong> — modals, auth cards</div>
    </div>
  </div>
</div>
</body>
</html>
