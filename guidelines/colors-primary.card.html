<!-- @dsCard group="Colors" viewport="700x130" subtitle="Brand primary — terracotta amber, dark + light mode" name="Primary Brand Color" -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Geist',ui-sans-serif,sans-serif;background:#0c0c0e;color:#f4f4f5;padding:20px 24px;-webkit-font-smoothing:antialiased}
</style>
</head>
<body>
<div style="display:flex;gap:12px;align-items:stretch">
  <div style="flex:2;border-radius:8px;overflow:hidden;border:1px solid #26262b">
    <div style="height:56px;background:oklch(0.72 0.13 58);display:flex;align-items:center;justify-content:center">
      <span style="font-size:13px;font-weight:600;color:#2a1a08">Primary button label</span>
    </div>
    <div style="padding:10px 12px;background:#161618">
      <div style="font-size:11px;font-weight:600;color:#8a8a93;letter-spacing:0.06em">PRIMARY — DARK</div>
      <div style="font-size:12px;color:#f4f4f5;margin-top:2px;font-weight:500">oklch(0.72 0.13 58)</div>
      <div style="font-size:11px;color:#8a8a93;margin-top:1px">--primary</div>
    </div>
  </div>
  <div style="flex:2;border-radius:8px;overflow:hidden;border:1px solid #26262b">
    <div style="height:56px;background:oklch(0.66 0.13 58);display:flex;align-items:center;justify-content:center">
      <span style="font-size:13px;font-weight:600;color:#2a1a08">Hover state</span>
    </div>
    <div style="padding:10px 12px;background:#161618">
      <div style="font-size:11px;font-weight:600;color:#8a8a93;letter-spacing:0.06em">PRIMARY HOVER</div>
      <div style="font-size:12px;color:#f4f4f5;margin-top:2px;font-weight:500">oklch(0.66 0.13 58)</div>
      <div style="font-size:11px;color:#8a8a93;margin-top:1px">--primary-hover</div>
    </div>
  </div>
  <div style="flex:2;border-radius:8px;overflow:hidden;border:1px solid #26262b">
    <div style="height:56px;background:oklch(0.62 0.14 50);display:flex;align-items:center;justify-content:center">
      <span style="font-size:13px;font-weight:600;color:#fff">Primary button label</span>
    </div>
    <div style="padding:10px 12px;background:#161618">
      <div style="font-size:11px;font-weight:600;color:#8a8a93;letter-spacing:0.06em">PRIMARY — LIGHT</div>
      <div style="font-size:12px;color:#f4f4f5;margin-top:2px;font-weight:500">oklch(0.62 0.14 50)</div>
      <div style="font-size:11px;color:#8a8a93;margin-top:1px">--primary (light)</div>
    </div>
  </div>
  <div style="flex:1;border-radius:8px;overflow:hidden;border:1px solid #26262b">
    <div style="height:56px;background:oklch(0.31 0.045 58)"></div>
    <div style="padding:10px 12px;background:#161618">
      <div style="font-size:11px;font-weight:600;color:#8a8a93;letter-spacing:0.06em">ROW SEL</div>
      <div style="font-size:11px;color:#f4f4f5;margin-top:2px;font-weight:500">oklch(0.31 0.045 58)</div>
      <div style="font-size:11px;color:#8a8a93;margin-top:1px">--row-sel</div>
    </div>
  </div>
</div>
</body>
</html>
