<!-- @dsCard group="Components" viewport="720x220" subtitle="shadcn Badge + Shelfree status variants, dot, sizes, CountChip" name="Badges" -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<script src="https://cdn.tailwindcss.com"></script>
<script src="../../lib/tailwind-shadcn.js"></script>
<link rel="stylesheet" href="../../styles.css">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Geist',ui-sans-serif,sans-serif;background:var(--background);color:var(--foreground);padding:20px 24px;-webkit-font-smoothing:antialiased}
.row{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--border)}
.row:last-child{border-bottom:none}
.label{width:92px;flex:none;font-size:10.5px;font-weight:600;color:var(--muted-fg);letter-spacing:0.06em}
</style>
</head>
<body>
<div>
  <div class="row">
    <div class="label">SHADCN</div>
    <span class="inline-flex items-center gap-1.5 rounded-md border px-2.5 py-0.5 text-xs font-medium leading-none border-transparent bg-primary text-primary-foreground shadow">Default</span>
    <span class="inline-flex items-center gap-1.5 rounded-md border px-2.5 py-0.5 text-xs font-medium leading-none border-transparent bg-secondary text-secondary-foreground">Secondary</span>
    <span class="inline-flex items-center gap-1.5 rounded-md border px-2.5 py-0.5 text-xs font-medium leading-none border-transparent bg-destructive text-destructive-foreground shadow">Destructive</span>
    <span class="inline-flex items-center gap-1.5 rounded-md border px-2.5 py-0.5 text-xs font-medium leading-none text-foreground">Outline</span>
  </div>
  <div class="row">
    <div class="label">STATUS</div>
    <span class="inline-flex items-center gap-1.5 rounded-md border px-2.5 py-0.5 text-xs font-medium leading-none border-transparent bg-[var(--ok-bg)] text-[color:var(--ok-fg)]">Shipped</span>
    <span class="inline-flex items-center gap-1.5 rounded-md border px-2.5 py-0.5 text-xs font-medium leading-none border-transparent bg-[var(--info-bg)] text-[color:var(--info-fg)]">In Progress</span>
    <span class="inline-flex items-center gap-1.5 rounded-md border px-2.5 py-0.5 text-xs font-medium leading-none border-transparent bg-[var(--warn-bg)] text-[color:var(--warn-fg)]">Low stock</span>
    <span class="inline-flex items-center gap-1.5 rounded-md border px-2.5 py-0.5 text-xs font-medium leading-none border-transparent bg-[var(--bad-bg)] text-[color:var(--bad-fg)]">Overdue</span>
    <span class="inline-flex items-center gap-1.5 rounded-md border px-2.5 py-0.5 text-xs font-medium leading-none border-transparent bg-[var(--neutral-bg)] text-[color:var(--neutral-fg)]">Draft</span>
  </div>
  <div class="row">
    <div class="label">WITH DOT</div>
    <span class="inline-flex items-center gap-1.5 rounded-md border px-2.5 py-0.5 text-xs font-medium leading-none border-transparent bg-[var(--warn-bg)] text-[color:var(--warn-fg)]"><span class="inline-block size-1.5 rounded-full bg-current"></span>Below reorder point</span>
    <span class="inline-flex items-center gap-1.5 rounded-md border px-2.5 py-0.5 text-xs font-medium leading-none border-transparent bg-[var(--bad-bg)] text-[color:var(--bad-fg)]"><span class="inline-block size-1.5 rounded-full bg-current"></span>Blocked</span>
    <span class="inline-flex items-center gap-1.5 rounded-md border px-2.5 py-0.5 text-xs font-medium leading-none border-transparent bg-[var(--ok-bg)] text-[color:var(--ok-fg)]"><span class="inline-block size-1.5 rounded-full bg-current"></span>Certified</span>
  </div>
  <div class="row">
    <div class="label">CHIP / PILL</div>
    <span class="inline-flex items-center justify-center min-w-[20px] h-5 px-1.5 rounded-full text-[11.5px] font-medium leading-none bg-muted text-muted-foreground">26</span>
    <span class="inline-flex items-center justify-center min-w-[20px] h-5 px-1.5 rounded-full text-[11.5px] font-medium leading-none bg-primary/15 text-primary">12</span>
    <span class="inline-flex items-center justify-center min-w-[20px] h-5 px-1.5 rounded-full text-[11.5px] font-medium leading-none bg-[var(--bad-bg)] text-[color:var(--bad-fg)]">3</span>
    <span class="inline-flex items-center gap-1.5 rounded-full border border-transparent bg-[var(--neutral-bg)] text-[color:var(--neutral-fg)] px-2.5 py-0.5 text-[11.5px] font-medium leading-none">NorthDoor Mfg.</span>
  </div>
</div>
</body>
</html>
