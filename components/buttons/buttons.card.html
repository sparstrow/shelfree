<!-- @dsCard group="Components" viewport="720x300" subtitle="shadcn Button — default/secondary/outline/ghost/destructive/link, sizes, icons, states" name="Buttons" -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<script src="https://cdn.tailwindcss.com"></script>
<script src="../../lib/tailwind-shadcn.js"></script>
<link rel="stylesheet" href="../../styles.css">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Geist',ui-sans-serif,sans-serif;background:var(--background);color:var(--foreground);padding:20px 24px;-webkit-font-smoothing:antialiased}
.row{display:flex;align-items:center;gap:8px;padding:11px 0;border-bottom:1px solid var(--border)}
.row:last-child{border-bottom:none}
.label{width:92px;flex:none;font-size:10.5px;font-weight:600;color:var(--muted-fg);letter-spacing:0.06em}
</style>
</head>
<body>
<div>
  <div class="row">
    <div class="label">VARIANTS</div>
    <button class="inline-flex items-center justify-center gap-2 whitespace-nowrap rounded-md text-sm font-medium transition-colors h-9 px-4 py-2 bg-primary text-primary-foreground shadow hover:bg-primary/90">Primary</button>
    <button class="inline-flex items-center justify-center gap-2 whitespace-nowrap rounded-md text-sm font-medium transition-colors h-9 px-4 py-2 bg-secondary text-secondary-foreground shadow-sm hover:bg-secondary/80">Secondary</button>
    <button class="inline-flex items-center justify-center gap-2 whitespace-nowrap rounded-md text-sm font-medium transition-colors h-9 px-4 py-2 border border-input bg-background shadow-sm hover:bg-accent hover:text-accent-foreground">Outline</button>
    <button class="inline-flex items-center justify-center gap-2 whitespace-nowrap rounded-md text-sm font-medium transition-colors h-9 px-4 py-2 hover:bg-accent hover:text-accent-foreground">Ghost</button>
    <button class="inline-flex items-center justify-center gap-2 whitespace-nowrap rounded-md text-sm font-medium transition-colors h-9 px-4 py-2 bg-destructive text-destructive-foreground shadow-sm hover:bg-destructive/90">Destructive</button>
    <button class="inline-flex items-center justify-center gap-2 whitespace-nowrap rounded-md text-sm font-medium transition-colors h-9 px-4 py-2 text-primary underline-offset-4 hover:underline">Link</button>
  </div>
  <div class="row">
    <div class="label">SIZES</div>
    <button class="inline-flex items-center justify-center gap-2 whitespace-nowrap rounded-md font-medium transition-colors h-8 px-3 text-xs bg-primary text-primary-foreground shadow hover:bg-primary/90">Small</button>
    <button class="inline-flex items-center justify-center gap-2 whitespace-nowrap rounded-md text-sm font-medium transition-colors h-9 px-4 py-2 bg-primary text-primary-foreground shadow hover:bg-primary/90">Default</button>
    <button class="inline-flex items-center justify-center gap-2 whitespace-nowrap rounded-md text-sm font-medium transition-colors h-10 px-8 bg-primary text-primary-foreground shadow hover:bg-primary/90">Large</button>
    <button aria-label="Add" class="inline-flex items-center justify-center whitespace-nowrap rounded-md font-medium transition-colors h-9 w-9 bg-primary text-primary-foreground shadow hover:bg-primary/90">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
    </button>
  </div>
  <div class="row">
    <div class="label">WITH ICON</div>
    <button class="inline-flex items-center justify-center gap-2 whitespace-nowrap rounded-md text-sm font-medium transition-colors h-9 px-4 py-2 bg-primary text-primary-foreground shadow hover:bg-primary/90">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>New item
    </button>
    <button class="inline-flex items-center justify-center gap-2 whitespace-nowrap rounded-md text-sm font-medium transition-colors h-9 px-4 py-2 border border-input bg-background shadow-sm hover:bg-accent hover:text-accent-foreground">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><rect x="3" y="3" width="18" height="18" rx="2"></rect><path d="M9 3v18M15 3v18"></path></svg>Columns
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m6 9 6 6 6-6"></path></svg>
    </button>
  </div>
  <div class="row">
    <div class="label">STATES</div>
    <button disabled class="inline-flex items-center justify-center gap-2 whitespace-nowrap rounded-md text-sm font-medium transition-colors h-9 px-4 py-2 bg-primary text-primary-foreground shadow disabled:pointer-events-none disabled:opacity-50">Disabled</button>
    <button class="inline-flex items-center justify-center gap-2 whitespace-nowrap rounded-md text-sm font-medium transition-colors h-9 px-4 py-2 bg-primary text-primary-foreground shadow ring-1 ring-ring outline-none">Focused</button>
    <span class="text-xs" style="color:var(--muted-fg)">focus-visible: 1px ring at --ring</span>
  </div>
</div>
</body>
</html>
