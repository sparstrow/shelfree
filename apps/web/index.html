<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shelfree</title>
      <script>
      // Apply the saved theme before first paint (no flash). Personal setting: shelfree.v2.me ▸ theme
      // (dark | light | system); the first build kept it in shelfree.v2.ui, read until one is saved.
      try {
        var me = JSON.parse(localStorage.getItem("shelfree.v2.me") || "{}");
        var t = me.theme;
        if (!t) {
          var ui = JSON.parse(localStorage.getItem("shelfree.v2.ui") || "{}");
          t = ui.state && ui.state.theme;
        }
        if (t === "system") t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
