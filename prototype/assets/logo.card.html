<!-- @dsCard group="Brand" viewport="700x140" subtitle="Shelfree wordmark — logo mark + text lockup, dark and light" name="Logo" -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Geist',ui-sans-serif,sans-serif;background:var(--background);color:var(--foreground);padding:24px;-webkit-font-smoothing:antialiased}
</style>
</head>
<body>
<div style="display:flex;gap:24px;align-items:stretch">
  <!-- Dark bg lockup -->
  <div style="flex:1;background:#08080a;border-radius:10px;border:1px solid #26262b;padding:24px;display:flex;flex-direction:column;gap:20px">
    <div style="font-size:10.5px;font-weight:600;color:#8a8a93;letter-spacing:0.06em">DARK (default)</div>
    <div style="display:flex;align-items:center;gap:10px">
      <div style="width:34px;height:34px;border-radius:9px;background:oklch(0.72 0.13 58);color:#2a1a08;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px;flex:none">S</div>
      <span style="font-size:18px;font-weight:700;letter-spacing:-0.02em;color:#f4f4f5">Shelfree</span>
    </div>
    <div style="display:flex;align-items:center;gap:8px">
      <div style="width:26px;height:26px;border-radius:7px;background:oklch(0.72 0.13 58);color:#2a1a08;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex:none">S</div>
      <span style="font-size:14px;font-weight:700;letter-spacing:-0.02em;color:#f4f4f5">Shelfree</span>
    </div>
  </div>
  <!-- Light bg lockup -->
  <div style="flex:1;background:#fff;border-radius:10px;border:1px solid #e4e4e7;padding:24px;display:flex;flex-direction:column;gap:20px">
    <div style="font-size:10.5px;font-weight:600;color:#71717a;letter-spacing:0.06em">LIGHT</div>
    <div style="display:flex;align-items:center;gap:10px">
      <div style="width:34px;height:34px;border-radius:9px;background:oklch(0.62 0.14 50);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px;flex:none">S</div>
      <span style="font-size:18px;font-weight:700;letter-spacing:-0.02em;color:#18181b">Shelfree</span>
    </div>
    <div style="display:flex;align-items:center;gap:8px">
      <div style="width:26px;height:26px;border-radius:7px;background:oklch(0.62 0.14 50);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex:none">S</div>
      <span style="font-size:14px;font-weight:700;letter-spacing:-0.02em;color:#18181b">Shelfree</span>
    </div>
  </div>
  <!-- Mark only -->
  <div style="width:120px;flex:none;background:#161618;border-radius:10px;border:1px solid #26262b;padding:24px;display:flex;flex-direction:column;align-items:center;gap:16px;justify-content:center">
    <div style="font-size:10.5px;font-weight:600;color:#8a8a93;letter-spacing:0.06em">MARK</div>
    <div style="width:48px;height:48px;border-radius:13px;background:oklch(0.72 0.13 58);color:#2a1a08;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:26px">S</div>
  </div>
</div>
</body>
</html>
