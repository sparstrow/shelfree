<!-- @dsCard group="Spacing" viewport="700x130" subtitle="Three shadow levels — base, hover lift, large panel" name="Shadows" -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Geist',ui-sans-serif,sans-serif;background:#1e1e22;color:#f4f4f5;padding:24px;-webkit-font-smoothing:antialiased}
</style>
</head>
<body>
<div style="display:flex;gap:20px;align-items:stretch">
  <div style="flex:1;background:#161618;border-radius:10px;border:1px solid #26262b;padding:16px;box-shadow:0 1px 2px rgb(0 0 0 / .4)">
    <div style="font-size:12px;font-weight:600;color:#f4f4f5;margin-bottom:6px">Base</div>
    <div style="font-size:11px;color:#8a8a93;line-height:1.6">0 1px 2px rgb(0 0 0 / .4)</div>
    <div style="font-size:10.5px;color:#8a8a93;margin-top:6px">--shadow · primary buttons, small elements</div>
  </div>
  <div style="flex:1;background:#161618;border-radius:10px;border:1px solid #26262b;padding:16px;box-shadow:0 4px 12px -3px rgb(0 0 0 / .28)">
    <div style="font-size:12px;font-weight:600;color:#f4f4f5;margin-bottom:6px">Hover Lift</div>
    <div style="font-size:11px;color:#8a8a93;line-height:1.6">0 4px 12px -3px rgb(0 0 0 / .28)</div>
    <div style="font-size:10.5px;color:#8a8a93;margin-top:6px">--shadow-hover · interactive hover state</div>
  </div>
  <div style="flex:1;background:#161618;border-radius:10px;border:1px solid #26262b;padding:16px;box-shadow:0 18px 44px -14px rgb(0 0 0 / .65)">
    <div style="font-size:12px;font-weight:600;color:#f4f4f5;margin-bottom:6px">Large</div>
    <div style="font-size:11px;color:#8a8a93;line-height:1.6">0 18px 44px -14px rgb(0 0 0 / .65)</div>
    <div style="font-size:10.5px;color:#8a8a93;margin-top:6px">--shadow-lg · drawers, modals, dropdowns</div>
  </div>
</div>
</body>
</html>
