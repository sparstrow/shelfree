<!-- @dsCard group="Colors" viewport="700x130" subtitle="Dark surface hierarchy — sidebar → background → panel → muted" name="Surface – Dark" -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Geist',ui-sans-serif,sans-serif;background:#0c0c0e;color:#f4f4f5;padding:20px 24px;-webkit-font-smoothing:antialiased}
</style>
</head>
<body>
<div style="display:flex;gap:12px;align-items:stretch">
  <div style="flex:1;border-radius:8px;overflow:hidden;border:1px solid #26262b">
    <div style="height:56px;background:#08080a"></div>
    <div style="padding:10px 12px;background:#161618">
      <div style="font-size:11px;font-weight:600;color:#8a8a93;letter-spacing:0.06em">SIDEBAR</div>
      <div style="font-size:12px;color:#f4f4f5;margin-top:2px;font-weight:500">#08080a</div>
      <div style="font-size:11px;color:#8a8a93;margin-top:1px">--sidebar</div>
    </div>
  </div>
  <div style="flex:1;border-radius:8px;overflow:hidden;border:1px solid #26262b">
    <div style="height:56px;background:#0c0c0e"></div>
    <div style="padding:10px 12px;background:#161618">
      <div style="font-size:11px;font-weight:600;color:#8a8a93;letter-spacing:0.06em">BACKGROUND</div>
      <div style="font-size:12px;color:#f4f4f5;margin-top:2px;font-weight:500">#0c0c0e</div>
      <div style="font-size:11px;color:#8a8a93;margin-top:1px">--background</div>
    </div>
  </div>
  <div style="flex:1;border-radius:8px;overflow:hidden;border:1px solid #26262b">
    <div style="height:56px;background:#161618"></div>
    <div style="padding:10px 12px;background:#161618">
      <div style="font-size:11px;font-weight:600;color:#8a8a93;letter-spacing:0.06em">PANEL / CARD</div>
      <div style="font-size:12px;color:#f4f4f5;margin-top:2px;font-weight:500">#161618</div>
      <div style="font-size:11px;color:#8a8a93;margin-top:1px">--panel / --card</div>
    </div>
  </div>
  <div style="flex:1;border-radius:8px;overflow:hidden;border:1px solid #26262b">
    <div style="height:56px;background:#1e1e22"></div>
    <div style="padding:10px 12px;background:#161618">
      <div style="font-size:11px;font-weight:600;color:#8a8a93;letter-spacing:0.06em">MUTED</div>
      <div style="font-size:12px;color:#f4f4f5;margin-top:2px;font-weight:500">#1e1e22</div>
      <div style="font-size:11px;color:#8a8a93;margin-top:1px">--muted</div>
    </div>
  </div>
  <div style="flex:1;border-radius:8px;overflow:hidden;border:1px solid #26262b">
    <div style="height:56px;background:#26262b"></div>
    <div style="padding:10px 12px;background:#161618">
      <div style="font-size:11px;font-weight:600;color:#8a8a93;letter-spacing:0.06em">BORDER</div>
      <div style="font-size:12px;color:#f4f4f5;margin-top:2px;font-weight:500">#26262b</div>
      <div style="font-size:11px;color:#8a8a93;margin-top:1px">--border</div>
    </div>
  </div>
</div>
</body>
</html>
