<!-- @dsCard group="Colors" viewport="700x110" subtitle="Foreground & text hierarchy — foreground, muted-fg, input border" name="Foreground Colors" -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Geist',ui-sans-serif,sans-serif;background:#0c0c0e;color:#f4f4f5;padding:20px 24px;-webkit-font-smoothing:antialiased}
</style>
</head>
<body>
<div style="display:flex;gap:12px">
  <div style="flex:1;padding:16px;border-radius:8px;background:#161618;border:1px solid #26262b">
    <div style="font-size:16px;font-weight:600;color:#f4f4f5;letter-spacing:-0.02em">Page title · Body text</div>
    <div style="font-size:11px;font-weight:600;color:#8a8a93;margin-top:8px;letter-spacing:0.06em">FOREGROUND — #f4f4f5 — --foreground</div>
  </div>
  <div style="flex:1;padding:16px;border-radius:8px;background:#161618;border:1px solid #26262b">
    <div style="font-size:16px;font-weight:500;color:#8a8a93;letter-spacing:-0.01em">Secondary · Meta · Labels</div>
    <div style="font-size:11px;font-weight:600;color:#8a8a93;margin-top:8px;letter-spacing:0.06em">MUTED-FG — #8a8a93 — --muted-fg</div>
  </div>
  <div style="flex:1;padding:16px;border-radius:8px;background:#161618;border:1px solid #26262b">
    <div style="font-size:16px;font-weight:500;color:#a1a1aa;letter-spacing:-0.01em">Placeholder · Disabled</div>
    <div style="font-size:11px;font-weight:600;color:#8a8a93;margin-top:8px;letter-spacing:0.06em">NEUTRAL-FG — #a1a1aa — --neutral-fg</div>
  </div>
</div>
</body>
</html>
