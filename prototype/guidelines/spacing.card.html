<!-- @dsCard group="Spacing" viewport="700x110" subtitle="4px base spacing scale — --space-1 through --space-12" name="Spacing Scale" -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Geist',ui-sans-serif,sans-serif;background:#0c0c0e;color:#f4f4f5;padding:20px 24px;-webkit-font-smoothing:antialiased}
</style>
</head>
<body>
<div style="display:flex;gap:16px;align-items:flex-end">
  <div style="display:flex;flex-direction:column;align-items:center;gap:8px">
    <div style="width:4px;background:oklch(0.72 0.13 58);border-radius:2px;height:4px"></div>
    <div style="font-size:10px;color:#8a8a93;font-family:'Geist Mono',monospace">4</div>
    <div style="font-size:10px;color:#8a8a93">--space-1</div>
  </div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:8px">
    <div style="width:8px;background:oklch(0.72 0.13 58);border-radius:2px;height:8px"></div>
    <div style="font-size:10px;color:#8a8a93;font-family:'Geist Mono',monospace">8</div>
    <div style="font-size:10px;color:#8a8a93">--space-2</div>
  </div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:8px">
    <div style="width:12px;background:oklch(0.72 0.13 58);border-radius:2px;height:12px"></div>
    <div style="font-size:10px;color:#8a8a93;font-family:'Geist Mono',monospace">12</div>
    <div style="font-size:10px;color:#8a8a93">--space-3</div>
  </div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:8px">
    <div style="width:16px;background:oklch(0.72 0.13 58);border-radius:2px;height:16px"></div>
    <div style="font-size:10px;color:#8a8a93;font-family:'Geist Mono',monospace">16</div>
    <div style="font-size:10px;color:#8a8a93">--space-4</div>
  </div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:8px">
    <div style="width:20px;background:oklch(0.72 0.13 58);border-radius:2px;height:20px"></div>
    <div style="font-size:10px;color:#8a8a93;font-family:'Geist Mono',monospace">20</div>
    <div style="font-size:10px;color:#8a8a93">--space-5</div>
  </div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:8px">
    <div style="width:24px;background:oklch(0.72 0.13 58);border-radius:2px;height:24px"></div>
    <div style="font-size:10px;color:#8a8a93;font-family:'Geist Mono',monospace">24</div>
    <div style="font-size:10px;color:#8a8a93">--space-6</div>
  </div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:8px">
    <div style="width:32px;background:oklch(0.72 0.13 58);border-radius:2px;height:32px"></div>
    <div style="font-size:10px;color:#8a8a93;font-family:'Geist Mono',monospace">32</div>
    <div style="font-size:10px;color:#8a8a93">--space-8</div>
  </div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:8px">
    <div style="width:40px;background:oklch(0.72 0.13 58);border-radius:2px;height:40px"></div>
    <div style="font-size:10px;color:#8a8a93;font-family:'Geist Mono',monospace">40</div>
    <div style="font-size:10px;color:#8a8a93">--space-10</div>
  </div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:8px">
    <div style="width:48px;background:oklch(0.72 0.13 58);border-radius:2px;height:48px"></div>
    <div style="font-size:10px;color:#8a8a93;font-family:'Geist Mono',monospace">48</div>
    <div style="font-size:10px;color:#8a8a93">--space-12</div>
  </div>
  <div style="flex:1;padding-left:16px;border-left:1px solid #26262b">
    <div style="font-size:11.5px;color:#8a8a93;line-height:1.7">
      <div>Common gaps: <strong style="color:#f4f4f5">4</strong> icon+label · <strong style="color:#f4f4f5">8</strong> inline · <strong style="color:#f4f4f5">12</strong> form fields</div>
      <div><strong style="color:#f4f4f5">14</strong> list rows · <strong style="color:#f4f4f5">20</strong> section padding · <strong style="color:#f4f4f5">24</strong> cards</div>
    </div>
  </div>
</div>
</body>
</html>
