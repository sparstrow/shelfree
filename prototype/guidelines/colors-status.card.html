<!-- @dsCard group="Colors" viewport="700x150" subtitle="Five semantic status colours — ok, info, warn, bad, neutral" name="Status Colors" -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Geist',ui-sans-serif,sans-serif;background:#0c0c0e;color:#f4f4f5;padding:20px 24px;-webkit-font-smoothing:antialiased}
.swatch{flex:1;border-radius:8px;border:1px solid #26262b;overflow:hidden}
.sw-top{height:44px;display:flex;align-items:center;justify-content:center}
.badge{display:inline-flex;align-items:center;height:22px;padding:0 9px;border-radius:5px;font-size:12px;font-weight:500;border:1px solid}
.sw-bot{padding:10px 12px;background:#161618}
.label{font-size:11px;font-weight:600;color:#8a8a93;letter-spacing:0.06em}
.hex{font-size:11.5px;color:#f4f4f5;margin-top:3px;font-weight:500}
.tok{font-size:10.5px;color:#8a8a93;margin-top:1px}
</style>
</head>
<body>
<div style="display:flex;gap:10px">
  <div class="swatch">
    <div class="sw-top" style="background:color-mix(in oklab,oklch(0.72 0.16 155) 16%,transparent)">
      <span class="badge" style="background:color-mix(in oklab,oklch(0.72 0.16 155) 16%,transparent);color:oklch(0.82 0.13 155);border-color:color-mix(in oklab,oklch(0.82 0.13 155) 28%,transparent)">Shipped</span>
    </div>
    <div class="sw-bot">
      <div class="label">OK / SUCCESS</div>
      <div class="hex">hue 155 · green</div>
      <div class="tok">--ok-bg / --ok-fg</div>
    </div>
  </div>
  <div class="swatch">
    <div class="sw-top" style="background:color-mix(in oklab,oklch(0.7 0.13 245) 16%,transparent)">
      <span class="badge" style="background:color-mix(in oklab,oklch(0.7 0.13 245) 16%,transparent);color:oklch(0.82 0.1 245);border-color:color-mix(in oklab,oklch(0.82 0.1 245) 28%,transparent)">In Progress</span>
    </div>
    <div class="sw-bot">
      <div class="label">INFO</div>
      <div class="hex">hue 245 · blue</div>
      <div class="tok">--info-bg / --info-fg</div>
    </div>
  </div>
  <div class="swatch">
    <div class="sw-top" style="background:color-mix(in oklab,oklch(0.78 0.14 70) 16%,transparent)">
      <span class="badge" style="background:color-mix(in oklab,oklch(0.78 0.14 70) 16%,transparent);color:oklch(0.84 0.12 75);border-color:color-mix(in oklab,oklch(0.84 0.12 75) 28%,transparent)">Low stock</span>
    </div>
    <div class="sw-bot">
      <div class="label">WARNING</div>
      <div class="hex">hue 70–75 · amber</div>
      <div class="tok">--warn-bg / --warn-fg</div>
    </div>
  </div>
  <div class="swatch">
    <div class="sw-top" style="background:color-mix(in oklab,oklch(0.7 0.18 25) 18%,transparent)">
      <span class="badge" style="background:color-mix(in oklab,oklch(0.7 0.18 25) 18%,transparent);color:oklch(0.82 0.13 25);border-color:color-mix(in oklab,oklch(0.82 0.13 25) 28%,transparent)">Overdue</span>
    </div>
    <div class="sw-bot">
      <div class="label">DANGER</div>
      <div class="hex">hue 25 · red</div>
      <div class="tok">--bad-bg / --bad-fg</div>
    </div>
  </div>
  <div class="swatch">
    <div class="sw-top" style="background:#26262b">
      <span class="badge" style="background:#26262b;color:#a1a1aa;border-color:transparent">Draft</span>
    </div>
    <div class="sw-bot">
      <div class="label">NEUTRAL</div>
      <div class="hex">#26262b / #a1a1aa</div>
      <div class="tok">--neutral-bg / --neutral-fg</div>
    </div>
  </div>
</div>
</body>
</html>
