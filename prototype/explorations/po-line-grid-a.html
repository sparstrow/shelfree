<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@500&display=swap" rel="stylesheet"><style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:'Geist',sans-serif;background:var(--background);color:var(--foreground);padding:28px;-webkit-font-smoothing:antialiased}.mono{font-family:'Geist Mono',monospace}</style></head>
<body data-theme="dark">
<div style="font-size:11px;font-weight:600;letter-spacing:.06em;color:var(--muted-fg);text-transform:uppercase;margin-bottom:10px">Option A &middot; dedicated checkbox + drag-handle columns</div>
<div style="border:1px solid var(--border);border-radius:12px;background:var(--card);overflow:hidden;max-width:920px">
<div style="display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 16px;border-bottom:1px solid var(--border)"><div style="font-size:13px;font-weight:600">Line items <span style="font-weight:500;color:var(--muted-fg)">&middot; 2 lines</span></div></div>
<table style="width:100%;border-collapse:collapse">
<thead><tr style="text-align:left;font-size:11px;font-weight:600;letter-spacing:.04em;color:var(--muted-fg);text-transform:uppercase">
<th style="padding:9px 8px;width:28px"></th><th style="padding:9px 6px;width:22px"></th>
<th style="padding:9px 16px">Item</th><th style="padding:9px 10px;width:70px">UoM</th>
<th style="padding:9px 10px;width:110px;text-align:right">Qty</th><th style="padding:9px 10px;width:140px;text-align:right">Unit cost</th>
<th style="padding:9px 16px;width:140px;text-align:right">Line total</th><th style="padding:9px 12px;width:32px"></th></tr></thead>
<tbody>
<tr style="border-top:1px solid var(--border)">
<td style="padding:9px 8px;text-align:center;color:var(--muted-fg)"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="6" r="1.3"/><circle cx="15" cy="6" r="1.3"/><circle cx="9" cy="12" r="1.3"/><circle cx="15" cy="12" r="1.3"/><circle cx="9" cy="18" r="1.3"/><circle cx="15" cy="18" r="1.3"/></svg></td>
<td style="padding:9px 6px;text-align:center"><input type="checkbox" style="width:14px;height:14px;accent-color:var(--primary)"></td>
<td style="padding:9px 16px"><div class="mono" style="font-size:12px;font-weight:500">RM-LID-BLK</div><div style="font-size:12.5px;color:var(--muted-fg);margin-top:2px">Ceramic Mountain Lid, Charcoal Black Glaze (component)</div></td>
<td style="padding:9px 10px;font-size:12.5px;color:var(--muted-fg)">NOS</td>
<td style="padding:9px 10px"><input value="120" style="width:100%;height:32px;padding:0 8px;font-size:13px;text-align:right;border-radius:7px;border:1px solid var(--input);background:transparent;color:var(--foreground)"></td>
<td style="padding:9px 10px"><input value="65" style="width:100%;height:32px;padding:0 8px;font-size:13px;text-align:right;border-radius:7px;border:1px solid var(--input);background:transparent;color:var(--foreground)"></td>
<td style="padding:9px 16px;text-align:right;font-size:13px;font-weight:500" class="mono">&#8377;7,800.00</td>
<td style="padding:9px 12px;text-align:center;color:var(--muted-fg)">&#8943;</td>
</tr>
<tr style="border-top:1px solid var(--border)">
<td style="padding:9px 8px;text-align:center;color:var(--muted-fg)"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="6" r="1.3"/><circle cx="15" cy="6" r="1.3"/><circle cx="9" cy="12" r="1.3"/><circle cx="15" cy="12" r="1.3"/><circle cx="9" cy="18" r="1.3"/><circle cx="15" cy="18" r="1.3"/></svg></td>
<td style="padding:9px 6px;text-align:center"><input type="checkbox" style="width:14px;height:14px;accent-color:var(--primary)"></td>
<td style="padding:9px 16px"><div class="mono" style="font-size:12px;font-weight:500">RM-GASKET</div><div style="font-size:12.5px;color:var(--muted-fg);margin-top:2px">Silicone Twist-Lock Gasket Ring (component)</div></td>
<td style="padding:9px 10px;font-size:12.5px;color:var(--muted-fg)">NOS</td>
<td style="padding:9px 10px"><input value="500" style="width:100%;height:32px;padding:0 8px;font-size:13px;text-align:right;border-radius:7px;border:1px solid var(--input);background:transparent;color:var(--foreground)"></td>
<td style="padding:9px 10px"><input value="3.2" style="width:100%;height:32px;padding:0 8px;font-size:13px;text-align:right;border-radius:7px;border:1px solid var(--input);background:transparent;color:var(--foreground)"></td>
<td style="padding:9px 16px;text-align:right;font-size:13px;font-weight:500" class="mono">&#8377;1,600.00</td>
<td style="padding:9px 12px;text-align:center;color:var(--muted-fg)">&#8943;</td>
</tr>
<tr style="border-top:1px dashed var(--border)"><td colspan="8" style="padding:10px 16px;font-size:12.5px;color:var(--muted-fg)">+ Add line</td></tr>
</tbody></table></div>
</body></html>
