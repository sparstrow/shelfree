<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="{{ nb.rootSt }}">
  <div style="{{ nb.headSt }}">
    <span style="font-size:11px; font-weight:600; letter-spacing:0.05em; color:var(--muted-fg);">NOTES</span>
    <span style="font-size:11px; font-weight:600; padding:1px 8px; border-radius:999px; background:var(--neutral-bg); color:var(--muted-fg); font-variant-numeric:tabular-nums; white-space:nowrap;">{{ nb.countLabel }}</span>
    <span style="flex:1;"></span>
    <sc-if value="{{ nb.invToggleText }}" hint-placeholder-val="{{ false }}">
      <button onClick="{{ nb.toggleInvalid }}" style="height:24px; padding:0 10px; border:1px solid var(--border); border-radius:999px; background:transparent; color:var(--muted-fg); font-family:inherit; font-size:11px; font-weight:600; cursor:pointer; transition:background .14s ease, color .14s ease, transform .14s ease, box-shadow .14s ease;" style-hover="color:var(--foreground); transform:translateY(-1px); box-shadow:var(--lift);">{{ nb.invalidToggleLabel }}</button>
    </sc-if>
    <sc-if value="{{ nb.invToggleIcon }}" hint-placeholder-val="{{ false }}">
      <button onClick="{{ nb.toggleInvalid }}" title="{{ nb.invalidToggleLabel }}" aria-label="{{ nb.invalidToggleLabel }}" aria-pressed="{{ nb.showingInvalid }}" style="width:26px; height:26px; flex:none; display:inline-flex; align-items:center; justify-content:center; border:1px solid var(--border); border-radius:7px; background:transparent; color:var(--muted-fg); cursor:pointer; transition:background .14s ease, color .14s ease, transform .14s ease, box-shadow .14s ease;" style-hover="background:color-mix(in oklab, var(--foreground) 10%, transparent); color:var(--foreground); transform:translateY(-1px); box-shadow:var(--lift);" style-focus="outline:2px solid var(--ring); outline-offset:1px;">
        <sc-if value="{{ nb.showingInvalid }}" hint-placeholder-val="{{ false }}"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.9 4.24A9.1 9.1 0 0 1 12 4c7 0 10 8 10 8a13.2 13.2 0 0 1-1.67 2.68M6.61 6.61A13.5 13.5 0 0 0 2 12s3 8 10 8a9.7 9.7 0 0 0 5.39-1.61M9.88 9.88a3 3 0 1 0 4.24 4.24M2 2l20 20"></path></svg></sc-if>
        <sc-if value="{{ nb.hidingInvalid }}" hint-placeholder-val="{{ true }}"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-8 10-8 10 8 10 8-3 8-10 8-10-8-10-8Z"></path><circle cx="12" cy="12" r="3"></circle></svg></sc-if>
      </button>
    </sc-if>
    <sc-if value="{{ nb.showViewAll }}" hint-placeholder-val="{{ false }}">
      <button onClick="{{ nb.openAll }}" title="{{ nb.viewAllTitle }}" aria-label="View all notes" style="width:26px; height:26px; flex:none; display:inline-flex; align-items:center; justify-content:center; border:1px solid var(--border); border-radius:7px; background:transparent; color:var(--muted-fg); cursor:pointer; transition:background .14s ease, color .14s ease, transform .14s ease, box-shadow .14s ease;" style-hover="background:color-mix(in oklab, var(--foreground) 10%, transparent); color:var(--foreground); transform:translateY(-1px); box-shadow:var(--lift);" style-focus="outline:2px solid var(--ring); outline-offset:1px;"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"></path></svg></button>
    </sc-if>
    <sc-if value="{{ nb.modalCompose }}" hint-placeholder-val="{{ false }}">
      <button onClick="{{ nb.openNew }}" title="{{ nb.newTitle }}" aria-label="New note" style="width:26px; height:26px; flex:none; display:inline-flex; align-items:center; justify-content:center; border:1px solid var(--border); border-radius:7px; background:transparent; color:var(--foreground); cursor:pointer; transition:background .14s ease, color .14s ease, border-color .14s ease, transform .14s ease, box-shadow .14s ease;" style-hover="background:var(--primary); color:var(--primary-fg); border-color:var(--primary); transform:translateY(-1px); box-shadow:var(--lift);" style-focus="outline:2px solid var(--ring); outline-offset:1px;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg></button>
    </sc-if>
  </div>
  <sc-if value="{{ nb.inlineCompose }}" hint-placeholder-val="{{ true }}">
  <div style="display:flex; gap:8px; align-items:flex-start;">
    <textarea value="{{ nb.text }}" onChange="{{ nb.setText }}" onKeyDown="{{ nb.onKey }}" placeholder="{{ nb.placeholder }}" style="flex:1; min-width:0; min-height:38px; max-height:120px; resize:vertical; padding:9px 11px; font-family:inherit; font-size:12.5px; line-height:1.5; border-radius:9px; border:1px solid var(--input); background:transparent; color:var(--foreground); outline:none;" style-focus="border-color:var(--ring); box-shadow:0 0 0 3px color-mix(in oklab, var(--primary) 16%, transparent);"></textarea>
    <button onClick="{{ nb.add }}" disabled="{{ nb.addDisabled }}" title="Add note (Ctrl/Cmd + Enter)" style="{{ nb.addSt }}" style-hover="{{ nb.addHover }}">Add note</button>
  </div>
  <div style="font-size:11px; color:var(--muted-fg);">{{ nb.hint }}</div>
  </sc-if>
  <div style="{{ nb.listSt }}">
    <sc-for list="{{ nb.rows }}" as="n" hint-placeholder-count="2">
      <div style="{{ n.rowSt }}">
        <div style="display:flex; align-items:center; gap:8px; min-width:0;">
          <span style="{{ n.avatarSt }}">{{ n.initials }}</span>
          <span style="font-size:12.5px; font-weight:600; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">{{ n.author }}</span>
          <span style="font-size:11.5px; color:var(--muted-fg); font-variant-numeric:tabular-nums; white-space:nowrap; flex-shrink:0;">{{ n.when }}</span>
          <sc-if value="{{ n.isInvalid }}" hint-placeholder-val="{{ false }}">
            <span style="font-size:10.5px; font-weight:700; letter-spacing:0.03em; padding:1px 7px; border-radius:999px; background:var(--bad-bg); color:var(--bad-fg);">INVALID</span>
          </sc-if>
          <span style="flex:1;"></span>
          <sc-if value="{{ n.canInvalidate }}" hint-placeholder-val="{{ false }}">
            <button onClick="{{ n.startInvalidate }}" aria-label="Mark invalid" title="Mark invalid — notes can never be edited or deleted, only marked invalid with a reason" style="width:24px; height:24px; flex-shrink:0; display:inline-flex; align-items:center; justify-content:center; padding:0; border:1px solid transparent; border-radius:7px; background:transparent; color:var(--muted-fg); cursor:pointer; opacity:0.7; transition:background .14s ease, color .14s ease, opacity .14s ease, transform .14s ease, border-color .14s ease;" style-hover="background:var(--bad-bg); color:var(--bad-fg); border-color:var(--border); opacity:1; transform:translateY(-1px);"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M5.6 5.6l12.8 12.8"></path></svg></button>
          </sc-if>
        </div>
        <div style="{{ n.textSt }}">{{ n.text }}</div>
        <sc-if value="{{ n.reasonShow }}" hint-placeholder-val="{{ false }}">
          <div style="margin-top:6px; padding:7px 9px; border-radius:8px; background:var(--bad-bg); color:var(--bad-fg); font-size:11.5px; line-height:1.45;">Marked invalid by {{ n.invalidatedBy }} · {{ n.invalidatedAt }} — {{ n.reason }}</div>
        </sc-if>
        <sc-if value="{{ n.formOpen }}" hint-placeholder-val="{{ false }}">
          <div style="margin-top:8px; display:flex; gap:7px; align-items:center; flex-wrap:wrap;">
            <input value="{{ nb.reasonVal }}" onChange="{{ nb.setReason }}" onKeyDown="{{ nb.onReasonKey }}" placeholder="Why is this note invalid? (required, permanent)" style="flex:1; min-width:180px; height:30px; padding:0 10px; font-family:inherit; font-size:12px; border-radius:8px; border:1px solid var(--input); background:transparent; color:var(--foreground); outline:none;" style-focus="border-color:var(--ring);">
            <button onClick="{{ nb.confirmInvalid }}" disabled="{{ nb.reasonEmpty }}" style="{{ nb.confirmSt }}">Mark invalid</button>
            <button onClick="{{ nb.cancelInvalid }}" style="height:30px; padding:0 11px; border:1px solid var(--border); border-radius:8px; background:transparent; color:var(--muted-fg); font-family:inherit; font-size:12px; font-weight:600; cursor:pointer; transition:color .14s ease, transform .14s ease;" style-hover="color:var(--foreground); transform:translateY(-1px);">Cancel</button>
          </div>
        </sc-if>
      </div>
    </sc-for>
    <sc-if value="{{ nb.empty }}" hint-placeholder-val="{{ false }}">
      <div style="padding:22px 8px; text-align:center; font-size:12.5px; color:var(--muted-fg);">{{ nb.emptyText }}</div>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:560,&quot;height&quot;:420},&quot;nb&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;object&quot;}}"></script>
</body>
</html>
